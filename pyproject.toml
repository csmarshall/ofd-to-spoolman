[project]
name = "ofd-to-spoolman"
version = "0.1.0"
description = "Open Filament Database (OFD) -> Spoolman external filament catalog bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["ofd2spoolman.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
