name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["catalog/**"] # the nightly catalog commits must not run the test matrix
  pull_request:
    paths-ignore: ["catalog/**"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  spoolman-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pull the real Spoolman image
        run: docker pull ghcr.io/donkie/spoolman:latest
      - name: Validate converter output with Spoolman's own models, and prove the check can fail
        run: tests/schema_check.sh
