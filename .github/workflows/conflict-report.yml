name: conflict-report

# Daily digest of SpoolmanDB vs OFD data conflicts into ONE tracking issue in this repo.
# Nothing is ever filed upstream.
#
# Scheduled-workflow auto-disable: GitHub's docs say scheduled workflows are disabled after 60 days
# without repository activity "in a public repository". This repo is private, so no keep-alive is
# needed. If it is ever made public, add one (or re-enable by hand under Actions).
#
# Previous-run state: the workflow artifact `conflict-state` from the last successful run (artifacts
# survive up to 90 days and are refreshed daily). If it is missing or expired the run is a baseline:
# the issue body is refreshed but no "new" comment is posted and a closed issue stays closed. Chosen over a JSON file on a dedicated
# branch because it needs no contents: write, no extra branch, and cannot trip branch protection.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issue body to the log; do not touch issues or state"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: conflict-report
  cancel-in-progress: false

env:
  ISSUE_TITLE: "SpoolmanDB vs OFD conflicts"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a real run from a non-default branch
        if: ${{ !inputs.dry_run && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::only the default branch may update the tracking issue and state; re-run with dry_run=true from other branches"
          exit 1

      - name: Fetch previous conflict state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Newest unexpired conflict-state artifact produced by a run on the default branch. Only "no such artifact"
          # is a baseline; API or download errors fail the step so a transient problem cannot silently reset state.
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=conflict-state&per_page=100")"
          run_id="$(jq -r '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == env.DEFAULT_BRANCH)] | sort_by(.created_at) | last | .workflow_run.id // empty' <<< "$artifacts")"
          if [ -z "$run_id" ]; then
            echo "no unexpired conflict-state artifact on ${DEFAULT_BRANCH}; baseline run"
          else
            gh run download "$run_id" --name conflict-state --dir previous
          fi

      - name: Build the conflict report
        run: |
          set -euo pipefail
          previous_args=()
          if [ -f previous/state.json ]; then previous_args=(--previous previous/state.json); fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/conflict_report.py --dry-run --run-url "$run_url" "${previous_args[@]}"
          else
            python3 tools/conflict_report.py --out report --run-url "$run_url" "${previous_args[@]}"
            jq . report/summary.json
            cat report/issue-body.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update the tracking issue
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          total="$(jq .total report/summary.json)"
          baseline="$(jq .baseline report/summary.json)"
          new="$(jq .new report/summary.json)"
          number="$(gh issue list --state all --limit 100 --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq 'first(.[] | select(.title == env.ISSUE_TITLE) | .number) // empty')"
          if [ -z "$number" ]; then
            if [ "$total" -eq 0 ]; then
              echo "no conflicts and no tracking issue; nothing to do"
              exit 0
            fi
            gh issue create --title "$ISSUE_TITLE" --body-file report/issue-body.md
            exit 0
          fi
          state="$(gh issue view "$number" --json state --jq .state)"
          # Only genuinely new conflicts reopen a closed issue; a baseline run (lost state) must not.
          if [ "$state" = "CLOSED" ] && [ "$baseline" = "false" ] && [ "$new" -gt 0 ]; then
            gh issue reopen "$number"
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${number}" --field body=@report/issue-body.md > /dev/null
          if [ -f report/new-conflicts.md ]; then
            gh issue comment "$number" --body-file report/new-conflicts.md
          fi

      - name: Save the full untruncated report
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: conflicts-full
          path: report/conflicts-full.md
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

      # Last and success-only on purpose: if the issue or comment step fails (locked issue, API error) the state
      # is NOT advanced, so the next run re-reports those conflicts (at-least-once) rather than losing them.
      # The cost is a possible duplicate comment if this upload alone fails after a successful comment.
      - name: Save conflict state for the next run
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: conflict-state
          path: report/state.json
          retention-days: 90
          overwrite: true
